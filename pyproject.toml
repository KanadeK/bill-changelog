[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bill-changelog"
version = "0.1.0"
description = "Local-first, evidence-linked diffs for recurring bills"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "bill",
  "consumer",
  "diff",
  "invoice",
  "local-first",
  "personal-finance",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Utilities",
]
dependencies = ["pypdf>=5.0,<7.0"]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "reportlab==5.0.0",
  "ruff==0.12.8",
]

[project.scripts]
billchangelog = "billchangelog.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/bill-changelog"
Issues = "https://github.com/KanadeK/bill-changelog/issues"
Repository = "https://github.com/KanadeK/bill-changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/billchangelog"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["billchangelog"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/billchangelog/report.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
