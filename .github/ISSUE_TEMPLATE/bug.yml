name: Bug report
description: Report a reproducible parser, comparison, report, or packaging defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload a real bill or personal account data. Reproduce with fictional text.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: Input format
      options: [TXT or Markdown, CSV, JSON, EML, PDF, Packaging or CI, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Fictional reproducer and command
      description: Replace all real identifiers and values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exit code
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this issue contains no real bill, account number, address, email, phone, barcode, QR code, or credential.
          required: true
