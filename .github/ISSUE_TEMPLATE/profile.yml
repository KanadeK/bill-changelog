name: Provider profile proposal
description: Propose a profile using fully fictional fixtures
title: "[Profile]: "
labels: [profile]
body:
  - type: input
    id: provider
    attributes:
      label: Provider or bill family
      description: A public provider name is okay; do not include an account.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Layout behavior to support
      description: Describe labels, aliases, totals, and cadence rules without pasting a real bill.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Fictional before/after fixture
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: All values and identifiers are fictional and cannot be traced to a real customer.
          required: true
